name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers cache each file for 10 minutes. Stamping every local import with the
      # commit makes a new deploy load fresh files instead of a stale mix.
      - name: Stamp file versions
        run: |
          v="${GITHUB_SHA::8}"
          find app -name '*.js' -exec sed -i -E "s#(from '\.\.?/[^']+\.js)'#\1?v=$v'#g" {} +
          sed -i -E "s#(assets/(js/app\.js|css/app\.css))\"#\1?v=$v\"#g; s#content=\"dev\"#content=\"$v\"#" app/index.html
          grep -c "?v=$v" app/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # GitHub sometimes can't see a just-uploaded artifact yet ("No artifacts named
      # github-pages"). Wait, and try once more before failing.
      - run: sleep 10
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
